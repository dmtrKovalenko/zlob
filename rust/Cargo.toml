[package]
name = "zlob"
version = "1.8.3"
edition = "2024"
license = "MIT"
description = "SIMD optimized glob pattern matching library faster than glob crate"
keywords = ["glob", "pattern", "matching", "simd", "gitignore"]
categories = ["filesystem", "text-processing"]
readme = "README.md"
repository = "https://github.com/dmtrKovalenko/zlob"
homepage = "https://github.com/dmtrKovalenko/zlob"
documentation = "https://docs.rs/zlob"
rust-version = "1.85"
include = [
    "/src/**/*",
    "/Cargo.toml",
    "/Cargo.lock", 
    "/build.rs",
    "/README.md",
    # Zig build system (symlinks resolved by cargo during packaging)
    "/build.zig",
    "/build.zig.zon",
    "/include/**/*",
    # Zig sources - symlinked as zig-src/, will be copied to package
    "/zig-src/**/*.zig",
    "!/zig-src/.zig-cache/**",
]

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
rustc-args = ["--cfg", "docsrs"]

[dependencies]
bitflags = "2"

[target.'cfg(target_os = "linux")'.dependencies]
zlob-prebuilt-linux = { version = "=1.8.3", path = "prebuilt/linux", optional = true }

[target.'cfg(target_vendor = "apple")'.dependencies]
zlob-prebuilt-apple = { version = "=1.8.3", path = "prebuilt/apple", optional = true }

[target.'cfg(windows)'.dependencies]
zlob-prebuilt-windows = { version = "=1.8.3", path = "prebuilt/windows", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
zlob-prebuilt-android = { version = "=1.8.3", path = "prebuilt/android", optional = true }

[target.'cfg(any(target_os = "freebsd", target_os = "netbsd"))'.dependencies]
zlob-prebuilt-bsd = { version = "=1.8.3", path = "prebuilt/bsd", optional = true }

[features]
default = ["prebuilt"]
# Link the static library shipped in the zlob-prebuilt-* crate for the target
# instead of compiling the Zig sources. Turn it off to always build with Zig
# and to keep the prebuilt crates out of your dependency tree.
prebuilt = [
    "dep:zlob-prebuilt-linux",
    "dep:zlob-prebuilt-apple",
    "dep:zlob-prebuilt-windows",
    "dep:zlob-prebuilt-android",
    "dep:zlob-prebuilt-bsd",
]

[build-dependencies]
bindgen = "0.72"

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }
glob = "0.3"
globset = "0.4"
walkdir = "2"
ignore = "0.4"
proptest = "1.11.0"

[[bench]]
name = "glob_comparison"
harness = false

[[bench]]
name = "walk_comparison"
harness = false
